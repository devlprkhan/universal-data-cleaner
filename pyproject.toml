[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-data-cleaner"
version = "2.5.0"
description = "Production-ready, scikit-learn-compatible data cleaning transformer for pandas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haseeb Khan" }]
requires-python = ">=3.10"
keywords = [
    "data-cleaning",
    "data-quality",
    "data-preprocessing",
    "feature-engineering",
    "machine-learning",
    "pandas",
    "scikit-learn",
    "tabular-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/devlprkhan/universal-data-cleaner"
Repository = "https://github.com/devlprkhan/universal-data-cleaner"
Issues = "https://github.com/devlprkhan/universal-data-cleaner/issues"
Changelog = "https://github.com/devlprkhan/universal-data-cleaner/blob/main/CHANGELOG.md"

[dependency-groups]
docs = [
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "mypy>=2.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_cleaner = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
ignore_missing_imports = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "yaml", "joblib.*"]
ignore_missing_imports = true
