[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-data-cleaner"
version = "2.1.0"
description = "Production-ready, scikit-learn-compatible data cleaning transformer for pandas."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Haseeb Khan" }]
requires-python = ">=3.10"
keywords = [
    "data-cleaning",
    "data-quality",
    "data-preprocessing",
    "feature-engineering",
    "machine-learning",
    "pandas",
    "scikit-learn",
    "tabular-data",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/devlprkhan/universal-data-cleaner"
Repository = "https://github.com/devlprkhan/universal-data-cleaner"
Issues = "https://github.com/devlprkhan/universal-data-cleaner/issues"
Changelog = "https://github.com/devlprkhan/universal-data-cleaner/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pytest>=9.1.1",
]

[tool.setuptools]
py-modules = ["data_cleaner"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
