site_name: Universal Data Cleaner
site_description: Leak-safe data cleaning for pandas and scikit-learn.
site_author: Haseeb Khan
site_url: https://devlprkhan.github.io/universal-data-cleaner/
repo_url: https://github.com/devlprkhan/universal-data-cleaner
repo_name: devlprkhan/universal-data-cleaner
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Haseeb Khan

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: IBM Plex Sans
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.select
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - toc.follow

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/devlprkhan/universal-data-cleaner
      name: GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/universal-data-cleaner/
      name: PyPI

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: false
            show_root_heading: true
            show_root_toc_entry: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_style: numpy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Start here:
      - Quickstart: quickstart.md
      - Leak-safe workflow: leak-safe-workflow.md
  - Guides:
      - Cleaning data: cleaning.md
      - Contracts & drift: contracts.md
      - Validation, joins & dedup: validation-joins.md
      - ML split audit: ml-split-audit.md
      - Production guide: production.md
  - Reference:
      - API reference: api.md
      - Artifacts & reproducibility: artifacts.md
      - Changelog: changelog.md
  - PyPI: https://pypi.org/project/universal-data-cleaner/
  - GitHub: https://github.com/devlprkhan/universal-data-cleaner
