<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 166 156" fill="none" role="img" aria-label="Universal Data Cleaner">
  <!-- The mark: noisy cells settling into clean columns, then cyan output.
       The "white" cells take the surrounding ink (currentColor) so one file works on
       the light and the dark theme; the cyan cells take the brand accent.
       This file is intentionally identical to logo.svg so the favicon matches the
       in-page mark. -->
  <g fill="currentColor">
    <rect x="18" y="24" width="16" height="16" fill-opacity="0.30"/>
    <rect x="50" y="20" width="16" height="16" fill-opacity="0.45"/>
    <rect x="34" y="48" width="16" height="16" fill-opacity="0.35"/>
    <rect x="2" y="70" width="16" height="16" fill-opacity="0.25"/>
    <rect x="26" y="74" width="16" height="16" fill-opacity="0.40"/>
    <rect x="52" y="70" width="16" height="16" fill-opacity="0.55"/>
    <rect x="18" y="98" width="16" height="16" fill-opacity="0.35"/>
    <rect x="52" y="120" width="16" height="16" fill-opacity="0.40"/>

    <!-- the transition column -->
    <rect x="76" y="20" width="16" height="16" fill-opacity="0.60"/>
    <rect x="76" y="44" width="16" height="16" fill-opacity="0.60"/>
    <rect x="76" y="70" width="16" height="16" fill-opacity="0.60"/>
    <rect x="76" y="94" width="16" height="16" fill-opacity="0.60"/>

    <!-- the clean column -->
    <rect x="100" y="20" width="16" height="16"/>
    <rect x="100" y="44" width="16" height="16"/>
    <rect x="100" y="70" width="16" height="16"/>
    <rect x="100" y="94" width="16" height="16"/>
    <rect x="100" y="120" width="16" height="16"/>
  </g>

  <g class="brand-cells" fill="#02eff0">
    <rect x="54" y="44" width="16" height="16" fill-opacity="0.65"/>
    <rect x="44" y="94" width="16" height="16" fill-opacity="0.65"/>
    <rect x="76" y="120" width="16" height="16" fill-opacity="0.75"/>

    <!-- the output columns -->
    <rect x="124" y="20" width="16" height="16"/>
    <rect x="148" y="20" width="16" height="16"/>
    <rect x="124" y="44" width="16" height="16"/>
    <rect x="148" y="44" width="16" height="16"/>
    <rect x="124" y="70" width="16" height="16"/>
    <rect x="148" y="70" width="16" height="16"/>
    <rect x="124" y="94" width="16" height="16"/>
    <rect x="148" y="94" width="16" height="16"/>
    <rect x="124" y="120" width="16" height="16"/>
    <rect x="148" y="120" width="16" height="16"/>
  </g>
</svg>
